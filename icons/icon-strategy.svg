<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="128" height="128">
  <style>
    rect { shape-rendering: crispEdges; }
  </style>
  <!-- Sky Background -->
  <rect width="32" height="32" fill="#1a1a3e" rx="4"/>

  <!-- Stars -->
  <rect x="3" y="2" width="1" height="1" fill="#ffffff"/>
  <rect x="28" y="4" width="1" height="1" fill="#ffffaa"/>
  <rect x="8" y="1" width="1" height="1" fill="#ffffcc"/>
  <rect x="24" y="1" width="1" height="1" fill="#ffffff"/>

  <!-- Ground -->
  <rect x="0" y="28" width="32" height="4" fill="#2d5a1e"/>
  <rect x="0" y="28" width="32" height="1" fill="#3a7a28"/>

  <!-- Main Castle Body -->
  <rect x="6" y="14" width="20" height="14" fill="#8a8a8a"/>
  <rect x="6" y="14" width="20" height="1" fill="#a0a0a0"/>

  <!-- Castle Front Texture -->
  <rect x="8" y="16" width="2" height="1" fill="#7a7a7a"/>
  <rect x="12" y="18" width="2" height="1" fill="#7a7a7a"/>
  <rect x="18" y="16" width="2" height="1" fill="#7a7a7a"/>
  <rect x="22" y="20" width="2" height="1" fill="#7a7a7a"/>
  <rect x="8" y="22" width="2" height="1" fill="#7a7a7a"/>

  <!-- Left Tower -->
  <rect x="4" y="8" width="6" height="20" fill="#9a9a9a"/>
  <rect x="4" y="8" width="6" height="1" fill="#b0b0b0"/>

  <!-- Left Tower Battlements -->
  <rect x="4" y="6" width="2" height="2" fill="#9a9a9a"/>
  <rect x="8" y="6" width="2" height="2" fill="#9a9a9a"/>
  <rect x="6" y="6" width="2" height="1" fill="#b0b0b0"/>

  <!-- Left Tower Window -->
  <rect x="6" y="11" width="2" height="3" fill="#1a1a3e"/>
  <rect x="6" y="11" width="2" height="1" fill="#2a2a5e"/>

  <!-- Right Tower -->
  <rect x="22" y="8" width="6" height="20" fill="#9a9a9a"/>
  <rect x="22" y="8" width="6" height="1" fill="#b0b0b0"/>

  <!-- Right Tower Battlements -->
  <rect x="22" y="6" width="2" height="2" fill="#9a9a9a"/>
  <rect x="26" y="6" width="2" height="2" fill="#9a9a9a"/>
  <rect x="24" y="6" width="2" height="1" fill="#b0b0b0"/>

  <!-- Right Tower Window -->
  <rect x="24" y="11" width="2" height="3" fill="#1a1a3e"/>
  <rect x="24" y="11" width="2" height="1" fill="#2a2a5e"/>

  <!-- Center Battlements -->
  <rect x="10" y="12" width="2" height="2" fill="#8a8a8a"/>
  <rect x="14" y="12" width="2" height="2" fill="#8a8a8a"/>
  <rect x="16" y="12" width="2" height="2" fill="#8a8a8a"/>
  <rect x="20" y="12" width="2" height="2" fill="#8a8a8a"/>

  <!-- Gate -->
  <rect x="13" y="22" width="6" height="6" fill="#4a3520"/>
  <rect x="14" y="22" width="4" height="6" fill="#5a4530"/>
  <rect x="13" y="22" width="6" height="1" fill="#3a2510" rx="0"/>

  <!-- Gate Arch -->
  <rect x="14" y="21" width="4" height="1" fill="#4a3520"/>
  <rect x="15" y="20" width="2" height="1" fill="#4a3520"/>

  <!-- Gate Details -->
  <rect x="15" y="24" width="1" height="1" fill="#ffd700"/>

  <!-- Flags -->
  <rect x="6" y="3" width="1" height="3" fill="#654321"/>
  <rect x="7" y="3" width="3" height="2" fill="#ff2222"/>
  <rect x="7" y="3" width="3" height="1" fill="#ff4444"/>

  <rect x="25" y="3" width="1" height="3" fill="#654321"/>
  <rect x="22" y="3" width="3" height="2" fill="#2255ff"/>
  <rect x="22" y="3" width="3" height="1" fill="#4477ff"/>
</svg>