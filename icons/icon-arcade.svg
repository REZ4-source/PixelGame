<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="128" height="128">
  <style>
    rect { shape-rendering: crispEdges; }
  </style>
  <!-- Background -->
  <rect width="32" height="32" fill="#1e1e3a" rx="4"/>

  <!-- Stick Shadow -->
  <rect x="16" y="8" width="2" height="14" fill="#1a1a1a"/>

  <!-- Stick -->
  <rect x="14" y="6" width="2" height="16" fill="#444444"/>
  <rect x="14" y="6" width="1" height="16" fill="#555555"/>

  <!-- Joystick Ball -->
  <rect x="12" y="2" width="6" height="2" fill="#ff3333"/>
  <rect x="11" y="4" width="8" height="2" fill="#ff2222"/>
  <rect x="11" y="6" width="8" height="2" fill="#dd1111"/>
  <rect x="12" y="8" width="6" height="1" fill="#cc0000"/>

  <!-- Ball Shine -->
  <rect x="13" y="3" width="2" height="1" fill="#ff6666"/>
  <rect x="12" y="4" width="1" height="1" fill="#ff5555"/>
  <rect x="13" y="4" width="1" height="1" fill="#ff7777"/>

  <!-- Base -->
  <rect x="4" y="22" width="24" height="4" fill="#3a3a3a"/>
  <rect x="6" y="20" width="20" height="2" fill="#4a4a4a"/>
  <rect x="4" y="26" width="24" height="3" fill="#2a2a2a"/>
  <rect x="6" y="29" width="20" height="1" fill="#222222"/>

  <!-- Base Top Highlight -->
  <rect x="6" y="20" width="20" height="1" fill="#5a5a5a"/>
  <rect x="4" y="22" width="24" height="1" fill="#484848"/>

  <!-- Base Side Texture -->
  <rect x="5" y="24" width="2" height="1" fill="#333333"/>
  <rect x="25" y="24" width="2" height="1" fill="#333333"/>

  <!-- Buttons on base -->
  <rect x="8" y="23" width="2" height="2" fill="#ff4444"/>
  <rect x="8" y="23" width="1" height="1" fill="#ff6666"/>

  <rect x="22" y="23" width="2" height="2" fill="#4444ff"/>
  <rect x="22" y="23" width="1" height="1" fill="#6666ff"/>

  <!-- Base bottom edge -->
  <rect x="4" y="28" width="24" height="1" fill="#1a1a1a"/>

  <!-- Decorative dots -->
  <rect x="13" y="24" width="1" height="1" fill="#555555"/>
  <rect x="15" y="24" width="1" height="1" fill="#555555"/>
  <rect x="17" y="24" width="1" height="1" fill="#555555"/>
</svg>