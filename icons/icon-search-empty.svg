<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="128" height="128">
  <style>
    rect { shape-rendering: crispEdges; }
  </style>
  
  <!-- Glow effect (outer) -->
  <rect x="3" y="3" width="4" height="2" fill="#ff6666" opacity="0.4"/>
  <rect x="3" y="3" width="2" height="4" fill="#ff6666" opacity="0.4"/>
  <rect x="25" y="3" width="4" height="2" fill="#ff6666" opacity="0.4"/>
  <rect x="27" y="3" width="2" height="4" fill="#ff6666" opacity="0.4"/>
  <rect x="3" y="25" width="4" height="2" fill="#ff6666" opacity="0.3"/>
  <rect x="25" y="25" width="4" height="2" fill="#ff6666" opacity="0.3"/>
  
  <!-- Main X -->
  <rect x="4" y="4" width="4" height="4" fill="#ff2d2d"/>
  <rect x="8" y="8" width="4" height="4" fill="#ff2d2d"/>
  <rect x="12" y="12" width="4" height="4" fill="#ff2d2d"/>
  <rect x="16" y="16" width="4" height="4" fill="#e62222"/>
  <rect x="20" y="20" width="4" height="4" fill="#d41c1c"/>
  <rect x="24" y="24" width="4" height="4" fill="#c41818"/>
  
  <rect x="24" y="4" width="4" height="4" fill="#ff2d2d"/>
  <rect x="20" y="8" width="4" height="4" fill="#ff2d2d"/>
  <rect x="16" y="12" width="4" height="4" fill="#e62222"/>
  <rect x="8" y="16" width="4" height="4" fill="#e62222"/>
  <rect x="4" y="20" width="4" height="4" fill="#d41c1c"/>
  <rect x="4" y="24" width="4" height="4" fill="#c41818"/>
  
  <!-- Inner highlights -->
  <rect x="4" y="4" width="4" height="1" fill="#ff6666"/>
  <rect x="4" y="4" width="1" height="4" fill="#ff6666"/>
  <rect x="24" y="4" width="4" height="1" fill="#ff6666"/>
  <rect x="27" y="4" width="1" height="4" fill="#ff5555"/>
  
  <rect x="5" y="5" width="2" height="2" fill="#ff5555"/>
  <rect x="25" y="5" width="2" height="2" fill="#ff5555"/>
  
  <!-- Dark corners -->
  <rect x="4" y="27" width="4" height="1" fill="#991111"/>
  <rect x="24" y="27" width="4" height="1" fill="#991111"/>
  <rect x="7" y="24" width="1" height="4" fill="#aa1515"/>
  <rect x="24" y="24" width="1" height="4" fill="#aa1515"/>
</svg>