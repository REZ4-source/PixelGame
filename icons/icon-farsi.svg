<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="128" height="128">
  <style>
    rect { shape-rendering: crispEdges; }
  </style>
  <!-- Background -->
  <rect width="32" height="32" fill="#1a0a2e" rx="4"/>

  <!-- Sparkles in background -->
  <rect x="4" y="4" width="1" height="1" fill="#ffffff" opacity="0.4"/>
  <rect x="27" y="7" width="1" height="1" fill="#ffffff" opacity="0.3"/>
  <rect x="6" y="26" width="1" height="1" fill="#ffffff" opacity="0.3"/>
  <rect x="25" y="24" width="1" height="1" fill="#ffffff" opacity="0.4"/>
  <rect x="3" y="15" width="1" height="1" fill="#aaddff" opacity="0.3"/>
  <rect x="28" y="16" width="1" height="1" fill="#aaddff" opacity="0.3"/>

  <!-- Diamond Top (Crown) -->
  <!-- Row 1 - very top -->
  <rect x="12" y="4" width="8" height="2" fill="#88ddff"/>
  <rect x="14" y="4" width="4" height="1" fill="#aaeeff"/>

  <!-- Row 2 -->
  <rect x="10" y="6" width="12" height="2" fill="#66ccff"/>
  <rect x="10" y="6" width="2" height="2" fill="#55bbee"/>
  <rect x="20" y="6" width="2" height="2" fill="#55bbee"/>

  <!-- Row 3 -->
  <rect x="8" y="8" width="16" height="2" fill="#55aaee"/>
  <rect x="8" y="8" width="2" height="2" fill="#4499dd"/>

  <!-- Crown facet lines -->
  <rect x="13" y="5" width="1" height="3" fill="#99eeff"/>
  <rect x="18" y="5" width="1" height="3" fill="#77ccee"/>
  <rect x="15" y="4" width="2" height="1" fill="#bbf0ff"/>

  <!-- Middle band (girdle) -->
  <rect x="6" y="10" width="20" height="2" fill="#4499dd"/>
  <rect x="6" y="10" width="20" height="1" fill="#55aaee"/>
  <rect x="6" y="11" width="20" height="1" fill="#3388cc"/>

  <!-- Diamond Bottom (Pavilion) -->
  <!-- Row 1 -->
  <rect x="7" y="12" width="18" height="2" fill="#3388cc"/>

  <!-- Row 2 -->
  <rect x="8" y="14" width="16" height="2" fill="#2277bb"/>

  <!-- Row 3 -->
  <rect x="9" y="16" width="14" height="2" fill="#2266aa"/>

  <!-- Row 4 -->
  <rect x="10" y="18" width="12" height="2" fill="#1b5599"/>

  <!-- Row 5 -->
  <rect x="11" y="20" width="10" height="2" fill="#154488"/>

  <!-- Row 6 -->
  <rect x="12" y="22" width="8" height="2" fill="#103377"/>

  <!-- Row 7 -->
  <rect x="13" y="24" width="6" height="2" fill="#0d2266"/>

  <!-- Row 8 - bottom point -->
  <rect x="14" y="26" width="4" height="1" fill="#0a1a55"/>
  <rect x="15" y="27" width="2" height="1" fill="#081244"/>

  <!-- Facet lines on bottom -->
  <rect x="15" y="12" width="1" height="15" fill="#1155aa" opacity="0.6"/>
  <rect x="12" y="12" width="1" height="11" fill="#1155aa" opacity="0.4"/>
  <rect x="19" y="12" width="1" height="11" fill="#0d4488" opacity="0.4"/>
  <rect x="10" y="12" width="1" height="7" fill="#1155aa" opacity="0.3"/>
  <rect x="21" y="12" width="1" height="7" fill="#0d4488" opacity="0.3"/>

  <!-- Shine / Light reflections -->
  <rect x="10" y="7" width="2" height="1" fill="#bbf0ff"/>
  <rect x="10" y="8" width="1" height="1" fill="#ccf5ff"/>
  <rect x="9" y="10" width="3" height="1" fill="#88ddff"/>

  <!-- Bright spot -->
  <rect x="11" y="6" width="1" height="1" fill="#ffffff"/>
  <rect x="12" y="5" width="1" height="1" fill="#ddf5ff"/>

  <!-- Inner glow on top facet -->
  <rect x="14" y="6" width="4" height="1" fill="#aaeeFF"/>
  <rect x="13" y="7" width="2" height="1" fill="#99ddff"/>

  <!-- Sparkle on top -->
  <rect x="15" y="2" width="1" height="1" fill="#ffffff"/>
  <rect x="14" y="3" width="1" height="1" fill="#ffffff" opacity="0.5"/>
  <rect x="16" y="3" width="1" height="1" fill="#ffffff" opacity="0.5"/>
  <rect x="15" y="3" width="1" height="1" fill="#ffffff" opacity="0.7"/>

  <!-- Small sparkle right -->
  <rect x="23" y="9" width="1" height="1" fill="#ffffff" opacity="0.6"/>
</svg>