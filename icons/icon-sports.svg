<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="128" height="128">
  <style>
    rect { shape-rendering: crispEdges; }
  </style>
  <!-- Background -->
  <rect width="32" height="32" fill="#2e8b57" rx="4"/>

  <!-- Grass texture -->
  <rect x="2" y="27" width="3" height="2" fill="#267a4a"/>
  <rect x="10" y="28" width="4" height="1" fill="#267a4a"/>
  <rect x="22" y="26" width="3" height="2" fill="#267a4a"/>

  <!-- Ball white base - circle shape -->
  <!-- Row 1 -->
  <rect x="12" y="4" width="8" height="2" fill="#f5f5f5"/>
  <!-- Row 2 -->
  <rect x="10" y="6" width="12" height="2" fill="#f5f5f5"/>
  <!-- Row 3 -->
  <rect x="8" y="8" width="16" height="2" fill="#f5f5f5"/>
  <!-- Row 4 -->
  <rect x="6" y="10" width="20" height="2" fill="#f5f5f5"/>
  <!-- Row 5 -->
  <rect x="6" y="12" width="20" height="2" fill="#f0f0f0"/>
  <!-- Row 6 -->
  <rect x="6" y="14" width="20" height="2" fill="#f0f0f0"/>
  <!-- Row 7 -->
  <rect x="6" y="16" width="20" height="2" fill="#ebebeb"/>
  <!-- Row 8 -->
  <rect x="6" y="18" width="20" height="2" fill="#ebebeb"/>
  <!-- Row 9 -->
  <rect x="8" y="20" width="16" height="2" fill="#e5e5e5"/>
  <!-- Row 10 -->
  <rect x="10" y="22" width="12" height="2" fill="#e0e0e0"/>
  <!-- Row 11 -->
  <rect x="12" y="24" width="8" height="2" fill="#dddddd"/>

  <!-- Pentagon patches (black) -->
  <!-- Top pentagon -->
  <rect x="14" y="5" width="4" height="1" fill="#2a2a2a"/>
  <rect x="13" y="6" width="6" height="2" fill="#2a2a2a"/>
  <rect x="14" y="8" width="4" height="1" fill="#2a2a2a"/>

  <!-- Left pentagon -->
  <rect x="7" y="12" width="4" height="1" fill="#2a2a2a"/>
  <rect x="6" y="13" width="5" height="2" fill="#2a2a2a"/>
  <rect x="7" y="15" width="4" height="1" fill="#2a2a2a"/>

  <!-- Right pentagon -->
  <rect x="21" y="12" width="4" height="1" fill="#2a2a2a"/>
  <rect x="21" y="13" width="5" height="2" fill="#2a2a2a"/>
  <rect x="21" y="15" width="4" height="1" fill="#2a2a2a"/>

  <!-- Bottom-left pentagon -->
  <rect x="10" y="20" width="4" height="1" fill="#2a2a2a"/>
  <rect x="9" y="21" width="5" height="2" fill="#2a2a2a"/>
  <rect x="10" y="23" width="3" height="1" fill="#2a2a2a"/>

  <!-- Bottom-right pentagon -->
  <rect x="18" y="20" width="4" height="1" fill="#2a2a2a"/>
  <rect x="18" y="21" width="5" height="2" fill="#2a2a2a"/>
  <rect x="19" y="23" width="3" height="1" fill="#2a2a2a"/>

  <!-- Seam lines connecting pentagons -->
  <rect x="14" y="9" width="1" height="1" fill="#cccccc"/>
  <rect x="17" y="9" width="1" height="1" fill="#cccccc"/>
  <rect x="11" y="10" width="1" height="1" fill="#cccccc"/>
  <rect x="20" y="10" width="1" height="1" fill="#cccccc"/>
  <rect x="12" y="17" width="1" height="1" fill="#cccccc"/>
  <rect x="19" y="17" width="1" height="1" fill="#cccccc"/>
  <rect x="14" y="19" width="1" height="1" fill="#cccccc"/>
  <rect x="17" y="19" width="1" height="1" fill="#cccccc"/>

  <!-- Shine highlight -->
  <rect x="10" y="7" width="2" height="1" fill="#ffffff"/>
  <rect x="9" y="8" width="1" height="1" fill="#ffffff"/>
  <rect x="10" y="9" width="1" height="1" fill="#ffffff"/>

  <!-- Shadow underneath -->
  <rect x="10" y="26" width="12" height="1" fill="#1a6b3a" opacity="0.5"/>
  <rect x="12" y="27" width="8" height="1" fill="#1a6b3a" opacity="0.3"/>
</svg>