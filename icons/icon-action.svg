<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="128" height="128">
  <style>
    rect { shape-rendering: crispEdges; }
  </style>
  <!-- Background -->
  <rect width="32" height="32" fill="#2d1b4e" rx="4"/>

  <!-- Left Sword Blade -->
  <rect x="4" y="4" width="2" height="2" fill="#e8e8e8"/>
  <rect x="6" y="6" width="2" height="2" fill="#f0f0f0"/>
  <rect x="8" y="8" width="2" height="2" fill="#f0f0f0"/>
  <rect x="10" y="10" width="2" height="2" fill="#f0f0f0"/>
  <rect x="12" y="12" width="2" height="2" fill="#f0f0f0"/>
  <rect x="14" y="14" width="2" height="2" fill="#dcdcdc"/>

  <!-- Left Sword Shine -->
  <rect x="5" y="4" width="1" height="2" fill="#ffffff"/>
  <rect x="7" y="6" width="1" height="2" fill="#ffffff"/>
  <rect x="9" y="8" width="1" height="2" fill="#ffffff"/>

  <!-- Right Sword Blade -->
  <rect x="26" y="4" width="2" height="2" fill="#e8e8e8"/>
  <rect x="24" y="6" width="2" height="2" fill="#f0f0f0"/>
  <rect x="22" y="8" width="2" height="2" fill="#f0f0f0"/>
  <rect x="20" y="10" width="2" height="2" fill="#f0f0f0"/>
  <rect x="18" y="12" width="2" height="2" fill="#f0f0f0"/>
  <rect x="16" y="14" width="2" height="2" fill="#dcdcdc"/>

  <!-- Right Sword Shine -->
  <rect x="26" y="4" width="1" height="2" fill="#ffffff"/>
  <rect x="24" y="6" width="1" height="2" fill="#ffffff"/>
  <rect x="22" y="8" width="1" height="2" fill="#ffffff"/>

  <!-- Cross Guard Left -->
  <rect x="12" y="16" width="2" height="2" fill="#ffd700"/>
  <rect x="10" y="16" width="2" height="2" fill="#daa520"/>
  <rect x="14" y="16" width="4" height="2" fill="#ffd700"/>
  <rect x="18" y="16" width="2" height="2" fill="#daa520"/>

  <!-- Cross Guard Right -->
  <rect x="12" y="18" width="8" height="1" fill="#b8860b"/>

  <!-- Left Sword Handle -->
  <rect x="13" y="19" width="2" height="2" fill="#8B4513"/>
  <rect x="12" y="21" width="2" height="2" fill="#a0522d"/>
  <rect x="11" y="23" width="2" height="2" fill="#8B4513"/>
  <rect x="10" y="25" width="2" height="2" fill="#654321"/>

  <!-- Left Pommel -->
  <rect x="9" y="27" width="3" height="2" fill="#ffd700"/>
  <rect x="10" y="27" width="1" height="1" fill="#ffec8b"/>

  <!-- Right Sword Handle -->
  <rect x="17" y="19" width="2" height="2" fill="#8B4513"/>
  <rect x="18" y="21" width="2" height="2" fill="#a0522d"/>
  <rect x="19" y="23" width="2" height="2" fill="#8B4513"/>
  <rect x="20" y="25" width="2" height="2" fill="#654321"/>

  <!-- Right Pommel -->
  <rect x="20" y="27" width="3" height="2" fill="#ffd700"/>
  <rect x="21" y="27" width="1" height="1" fill="#ffec8b"/>

  <!-- Spark effects -->
  <rect x="15" y="13" width="2" height="2" fill="#ffff88"/>
  <rect x="15" y="11" width="1" height="1" fill="#ffffcc"/>
  <rect x="17" y="14" width="1" height="1" fill="#ffffcc"/>
  <rect x="14" y="12" width="1" height="1" fill="#ffff44"/>
</svg>